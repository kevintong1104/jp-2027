<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<meta name="robots" content="noindex, nofollow">
<title>冬日滑雪之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFCF6;
    --ink: #3E3A39;
    --ink-soft: #7A726E;
    --coral: #F2A497;
    --yellow: #F6D27A;
    --mizu: #A8D3E6;
    --green: #B9DAA5;
    --coral-l: #FBE1DB;
    --yellow-l: #FCEFC8;
    --mizu-l: #E3F1F7;
    --green-l: #E6F2DE;
    --cream: #F4ECDF;
    --white: #FFFFFF;
    --line: 3px solid var(--ink);
    --r-lg: 26px;
    --r-md: 18px;
    --shadow: 0 4px 0 var(--ink);
    --nav-h: 58px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html.motion { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- 頂端選單 ---------- */
  .nav {
    position: fixed; inset: 0 0 auto 0; z-index: 50;
    height: var(--nav-h);
    padding-top: env(safe-area-inset-top);
    background: var(--paper);
    border-bottom: var(--line);
  }
  .nav-inner {
    max-width: 640px; height: 100%; margin: 0 auto;
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
  }
  .nav-brand { display: flex; align-items: center; margin-right: auto; }
  .nav-brand svg { width: 34px; height: 34px; }
  .nav a.link {
    text-decoration: none; font-size: 15px;
    padding: 5px 10px; border-radius: 999px; border: 2.5px solid transparent;
    white-space: nowrap;
  }
  .nav a.link.on { background: var(--yellow); border-color: var(--ink); }

  main { max-width: 640px; margin: 0 auto; padding: calc(var(--nav-h) + 16px) 16px 48px; }
  section { scroll-margin-top: calc(var(--nav-h) + 12px); margin-bottom: 40px; }

  .card {
    background: var(--white);
    border: var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
  }
  .sec-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 22px; margin: 0 0 16px; font-weight: normal;
  }
  .sec-title .ico {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border: var(--line); border-radius: 14px;
  }
  .sec-title .ico svg { width: 26px; height: 26px; }
  .sec-title small { font-size: 13px; color: var(--ink-soft); margin-left: auto; }

  /* ---------- 首頁 ---------- */
  .hero { overflow: hidden; }
  .hero-art { display: block; width: 100%; height: auto; border-bottom: var(--line); background: var(--mizu-l); }
  .hero-body { padding: 18px 18px 20px; text-align: center; }
  .hero-kicker {
    display: inline-block; font-size: 13px; padding: 2px 12px;
    background: var(--green-l); border: 2.5px solid var(--ink); border-radius: 999px;
  }
  .hero h1 { font-size: 30px; font-weight: normal; margin: 10px 0 2px; letter-spacing: 2px; }
  .hero .route { margin: 0 0 16px; color: var(--ink-soft); font-size: 15px; }
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cd-box {
    border: var(--line); border-radius: var(--r-md); padding: 8px 0 6px;
    background: var(--yellow-l);
  }
  .cd-box:nth-child(2) { background: var(--coral-l); }
  .cd-box:nth-child(3) { background: var(--mizu-l); }
  .cd-box:nth-child(4) { background: var(--green-l); }
  .cd-num { font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cd-unit { font-size: 12px; color: var(--ink-soft); }
  .cd-label { margin: 0 0 8px; font-size: 15px; }
  .cd-msg {
    border: var(--line); border-radius: var(--r-md); padding: 14px; background: var(--yellow-l); font-size: 20px;
  }
  .families { display: grid; gap: 8px; margin: 16px auto 0; text-align: left; font-size: 14px; max-width: 360px; }
  .fam { display: flex; gap: 8px; align-items: center; }
  .fam .chip { flex: none; }
  .fam .ppl { display: flex; flex-wrap: wrap; column-gap: 12px; }
  .fam .ppl span { white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; padding: 1px 10px;
    border: 2.5px solid var(--ink); border-radius: 999px; background: var(--white);
    white-space: nowrap;
  }
  .motion-toggle {
    margin-top: 14px; font-size: 13px; background: none; border: none; color: var(--ink-soft);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px;
  }

  /* ---------- 航班 ---------- */
  .flights { display: grid; gap: 16px; }
  .flight { padding: 0; overflow: hidden; }
  .flight-top {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 3px dashed var(--ink);
  }
  .flight-top .date { font-size: 16px; }
  .flight-top .no { margin-left: auto; font-size: 15px; letter-spacing: 1px; }
  .flight-main {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 16px 12px; gap: 6px;
  }
  .port .code { font-size: 30px; line-height: 1.1; letter-spacing: 1px; }
  .port .name { font-size: 13px; color: var(--ink-soft); }
  .port .time { font-size: 20px; margin-top: 2px; }
  .port.to { text-align: right; }
  .flight-mid { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
  .flight-mid svg { width: 56px; height: 28px; }
  .flight-mid .dur { font-size: 12px; color: var(--ink-soft); }
  .flight-who { padding: 0 16px 12px; font-size: 14px; color: var(--ink-soft); }
  .port .time.tbd { font-size: 14px; color: var(--ink-soft); }
  .fam-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .fam-btn {
    cursor: pointer; padding: 3px 14px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--white);
  }
  .fam-btn.on { background: var(--c); box-shadow: 0 3px 0 var(--ink); }
  .flight.past { opacity: .55; }
  .flight.past .flight-top::after { content: "已完成"; font-size: 12px; margin-left: 6px; }

  .rails { display: grid; gap: 12px; margin-top: 16px; }
  .rail { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--yellow-l); }
  .rail svg { width: 52px; height: 30px; flex: none; }
  .rail .r-main { font-size: 16px; }
  .rail .r-sub { font-size: 13px; color: var(--ink-soft); }

  /* ---------- 每日行程 ---------- */
  .days-wrap { position: relative; }
  .day-strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px;
    scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: none; scroll-snap-align: center;
    width: 58px; padding: 6px 0 4px; text-align: center; cursor: pointer;
    background: var(--white); border: var(--line); border-radius: 16px;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform .15s;
  }
  .day-btn .d { display: block; font-size: 17px; line-height: 1.2; }
  .day-btn .w { display: block; font-size: 12px; color: var(--ink-soft); }
  .day-btn .dot { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 4px auto 0; border: 2px solid var(--ink); }
  .day-btn.on { background: var(--coral); }
  .day-btn.on .w { color: var(--ink); }
  .day-btn.today::after {
    content: "今天"; display: block; font-size: 10px; margin-top: 2px;
  }
  .day-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  .day-head { display: flex; gap: 14px; align-items: center; padding: 14px 16px; margin-bottom: 18px; }
  .day-head .art {
    width: 72px; height: 72px; flex: none; border: var(--line); border-radius: 20px;
    display: grid; place-items: center;
  }
  .day-head .art svg { width: 58px; height: 58px; }
  .day-head .meta { min-width: 0; }
  .day-head .num { font-size: 13px; color: var(--ink-soft); }
  .day-head h3 { font-size: 21px; font-weight: normal; margin: 0; line-height: 1.35; }
  .day-head .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 10px; top: 10px; bottom: 10px;
    border-left: 3px dashed var(--ink);
  }
  .tl-item { position: relative; margin-bottom: 14px; }
  .tl-item::before {
    content: ""; position: absolute; left: -26px; top: 16px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--dot, var(--yellow)); border: 3px solid var(--ink);
  }
  .tl-card { padding: 12px 14px; border-radius: var(--r-md); position: relative; }
  .tl-time { font-size: 14px; color: var(--ink-soft); }
  .tl-title { font-size: 18px; margin: 0; line-height: 1.4; padding-right: 54px; }
  .tl-desc { font-size: 14px; margin: 4px 0 0; color: var(--ink-soft); }
  .tl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 12px; padding: 1px 9px; border-radius: 999px;
    border: 2px solid var(--ink); white-space: nowrap;
  }
  .tl-item.empty .tl-card { background: var(--paper); border-style: dashed; box-shadow: none; }
  .must {
    position: absolute; top: 10px; right: 10px;
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--coral); border: 3px solid var(--ink);
    font-size: 15px; transform: rotate(-10deg);
  }
  .day-tip {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; background: var(--yellow-l); border-radius: var(--r-md);
    font-size: 14px; margin-top: 4px;
  }
  .day-tip svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .day-nav { display: flex; justify-content: space-between; margin-top: 16px; }
  .pill-btn {
    cursor: pointer; padding: 6px 16px; border-radius: 999px;
    background: var(--white); border: var(--line); box-shadow: 0 3px 0 var(--ink);
  }
  .pill-btn:disabled { opacity: .35; cursor: default; }
  .pill-btn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

  /* ---------- 待辦清單 ---------- */
  .todo-card { padding: 16px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
  .bar { flex: 1; height: 16px; border: var(--line); border-radius: 999px; background: var(--paper); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-right: 3px solid var(--ink); }
  html.motion .bar i { transition: width .4s cubic-bezier(.34,1.56,.64,1); }
  .todo-list { list-style: none; margin: 0; padding: 0; }
  .todo-list li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 2px dotted #CFC7BE; }
  .todo-list li:last-child { border-bottom: none; }
  .todo-list label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
  .todo-list input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0;
    width: 24px; height: 24px; border: 3px solid var(--ink); border-radius: 8px; background: var(--white);
    display: grid; place-items: center; cursor: pointer;
  }
  .todo-list input[type=checkbox]:checked { background: var(--green); }
  .todo-list input[type=checkbox]:checked::after {
    content: ""; width: 7px; height: 12px; border: solid var(--ink); border-width: 0 3px 3px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  html.motion .todo-list input[type=checkbox]:checked { animation: pop .35s; }
  .todo-list .txt { overflow-wrap: anywhere; }
  .todo-list input:checked + .txt { text-decoration: line-through; color: var(--ink-soft); }
  .todo-list .cat { font-size: 11px; padding: 0 7px; border: 2px solid var(--ink); border-radius: 999px; flex: none; }
  .del { flex: none; background: none; border: none; cursor: pointer; font-size: 18px; padding: 0 6px; color: var(--ink-soft); }
  .todo-add { display: flex; gap: 8px; margin-top: 12px; }
  .todo-add input {
    flex: 1; min-width: 0; padding: 8px 14px; border: var(--line); border-radius: 999px; background: var(--paper);
  }
  .todo-add button { flex: none; }

  /* ---------- 住宿 ---------- */
  .stays { display: grid; gap: 16px; }
  .stay { padding: 14px 16px 16px; }
  .stay-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stay-head .art { width: 46px; height: 46px; flex: none; border: var(--line); border-radius: 14px; display: grid; place-items: center; }
  .stay-head .art svg { width: 34px; height: 34px; }
  .stay-head h3 { margin: 0; font-size: 18px; font-weight: normal; line-height: 1.3; }
  .stay-head .dates { font-size: 13px; color: var(--ink-soft); }
  .stay-head .nights { margin-left: auto; }
  .stay-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .stay-info {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0;
    padding: 12px 14px; background: var(--mizu-l); border: 2.5px solid var(--ink); border-radius: 14px;
  }
  .stay-info dt { font-size: 13px; color: var(--ink-soft); }
  .stay-info dd { margin: 0; }
  .field { display: block; margin-top: 8px; }
  .field span { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .field input {
    width: 100%; padding: 7px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper);
  }
  .field input:focus, .todo-add input:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 12px; }

  footer { text-align: center; font-size: 13px; color: var(--ink-soft); padding-bottom: 24px; }
  footer svg { width: 60px; height: 40px; display: block; margin: 0 auto 4px; }

  :focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  /* ---------- 動畫（只在允許動態時啟用） ---------- */
  .hero-art .anim { transform-box: fill-box; }
  html.motion .float { animation: float 3.2s ease-in-out infinite; }
  html.motion .drift { animation: drift 9s ease-in-out infinite alternate; }
  html.motion .drift.slow { animation-duration: 13s; }
  html.motion .sway { transform-origin: 50% 0; animation: sway 2.8s ease-in-out infinite; }
  html.motion .chug { animation: chug .5s steps(2) infinite; }
  html.motion .train-run { animation: run 7s ease-in-out infinite alternate; }
  html.motion .wobble { transform-origin: 50% 100%; animation: wobble 3s ease-in-out infinite; }
  html.motion .twinkle { transform-origin: center; animation: twinkle 4s ease-in-out infinite; }
  html.motion .flake { animation: fall var(--t, 7s) linear infinite; animation-delay: var(--d, 0s); }
  html:not(.motion) .flake { opacity: .9; }
  html.motion .bounce-in { animation: bounceIn .55s cubic-bezier(.34,1.56,.64,1) both; }
  html.motion .tl-item.bounce-in { animation-delay: calc(var(--i) * 60ms + 80ms); }
  html.motion .day-btn.on { animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  html.motion .must { animation: stamp .5s cubic-bezier(.34,1.56,.64,1) both; animation-delay: .3s; }
  html.motion .sec-title .ico svg { animation: float 3.6s ease-in-out infinite; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(14px); } }
  @keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes chug { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
  @keyframes run { from { transform: translateX(-24px); } to { transform: translateX(26px); } }
  @keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes twinkle { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08) rotate(8deg); } }
  @keyframes fall {
    0% { transform: translate(0, -30px); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(14px, 270px); opacity: .9; }
  }
  @keyframes bounceIn {
    0% { opacity: 0; transform: translateY(14px) scale(.96); }
    60% { opacity: 1; transform: translateY(-4px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 70% { transform: scale(.96); } 100% { transform: scale(1); } }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-10deg) scale(1.8); } 100% { opacity: 1; transform: rotate(-10deg) scale(1); } }

  @media (max-width: 380px) {
    .nav a.link { padding: 5px 7px; font-size: 14px; }
    .hero h1 { font-size: 26px; }
    .cd-num { font-size: 24px; }
    .port .code { font-size: 26px; }
  }
</style>
</head>
<body>

<nav class="nav" aria-label="主選單">
  <div class="nav-inner">
    <a class="nav-brand" href="#home" aria-label="回到首頁">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/><path d="M20 9v22M10.5 14.5l19 11M29.5 14.5l-19 11" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/><path d="M20 9v22M10.5 14.5l19 11M29.5 14.5l-19 11" stroke="#3E3A39" stroke-width="1.2" stroke-linecap="round"/></svg>
    </a>
    <a class="link" href="#home">首頁</a>
    <a class="link" href="#flights">航班</a>
    <a class="link" href="#days">行程</a>
    <a class="link" href="#todo">清單</a>
    <a class="link" href="#stay">住宿</a>
  </div>
</nav>

<main>
  <!-- 首頁 -->
  <section id="home">
    <div class="card hero">
      <svg class="hero-art" viewBox="0 0 400 260" role="img" aria-label="雪山、纜車、新幹線與飛機的插圖">
        <!-- 太陽 -->
        <g class="anim twinkle"><circle cx="340" cy="52" r="24" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
          <circle cx="332" cy="54" r="2.4" fill="#3E3A39"/><circle cx="348" cy="54" r="2.4" fill="#3E3A39"/>
          <path d="M335 61q5 4 10 0" fill="none" stroke="#3E3A39" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="327" cy="60" r="3" fill="#F2A497"/><circle cx="353" cy="60" r="3" fill="#F2A497"/></g>
        <!-- 雲 -->
        <g class="anim drift"><path d="M34 74h66a13 13 0 0 0 0-26 21 21 0 0 0-38-8 15 15 0 0 0-27 13 11 11 0 0 0-1 21z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g>
        <g class="anim drift slow"><path d="M246 40h44a10 10 0 0 0 0-20 15 15 0 0 0-27-5 11 11 0 0 0-17 25z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g>
        <!-- 遠山 -->
        <path d="M-4 204 L90 95 L150 160 L220 70 L320 180 L404 116 V264 H-4Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        <path d="M72 116 L90 95 L109 116 L101 111 L95 119 L88 111 L80 119Z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M197 100 L220 70 L247 100 L238 94 L230 104 L222 95 L213 104 L205 95Z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 纜車 -->
        <path d="M150 92 L398 64" stroke="#3E3A39" stroke-width="2.5"/>
        <g class="anim sway">
          <path d="M296 75.5 v12" stroke="#3E3A39" stroke-width="2.5"/>
          <rect x="283" y="87" width="27" height="22" rx="7" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
          <rect x="288" y="92" width="17" height="8" rx="3" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2"/>
        </g>
        <!-- 飛機 -->
        <g class="anim float">
          <g transform="translate(128 34)">
            <path d="M8 4 L2 -12 H12 L22 4Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
            <rect x="0" y="2" width="78" height="17" rx="8.5" fill="#FFFFFF" stroke="#3E3A39" stroke-width="3"/>
            <path d="M34 13 L22 32 H33 L50 13Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="30" cy="9" r="2.2" fill="#3E3A39"/><circle cx="39" cy="9" r="2.2" fill="#3E3A39"/><circle cx="48" cy="9" r="2.2" fill="#3E3A39"/><circle cx="57" cy="9" r="2.2" fill="#3E3A39"/>
            <path d="M68 6 h5" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>

<script>
(() => {
  /* ---------- 小工具 ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 減少動態效果 ---------- */
  const root = document.documentElement;
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');

  function applyMotion() {
    const pref = store.get('ski.motion', null); // null = 跟隨系統
    const on = pref == null ? !mq.matches : pref;
    root.classList.toggle('motion', on);
    toggle.textContent = on ? '關閉動畫效果' : '開啟動畫效果';
    toggle.setAttribute('aria-pressed', String(!on));
  }
  toggle.addEventListener('click', () => {
    store.set('ski.motion', !root.classList.contains('motion'));
    applyMotion();
  });
  mq.addEventListener ? mq.addEventListener('change', applyMotion) : mq.addListener(applyMotion);
  applyMotion();

    yuzawa: { name: '越後湯澤', bg: 'var(--mizu-l)', dot: 'var(--mizu)' },

  const FAM = {

    mojin: { name: '魔人家', c: 'var(--mizu)' },
    axu: { name: '阿續家', c: 'var(--green)' }
  };
  // 魔人家、阿續家在日本的日期（含頭尾），用來在每日行程顯示誰也在
  const MEMBERS = [
    { fam: 'mojin', name: '魔人', from: '2027-01-15', to: '2027-01-24' },
    { fam: 'mojin', name: '妹妹', from: '2027-01-15', to: '2027-01-26' },
    { fam: 'mojin', name: '星羽', from: '2027-01-15', to: '2027-01-26' },

    { date: '2027-01-15', wd: '五', fam: 'mojin', air: '國泰', no: 'CX450', who: '魔人・妹妹・星羽', from: ['TPE', '桃園 第1航廈', '13:00'], to: ['NRT', '成田 第2航廈', '17:15'], tz: [8, 9], est: true },
    { date: '2027-01-15', wd: '五', fam: 'kevin', air: 'ANA', no: 'NH854', who: '凱文・Ann・Owen', from: ['TSA', '台北松山', '16:50'], to: ['HND', '東京羽田', '20:40'], tz: [8, 9] },
    { date: '2027-01-16', wd: '六', fam: 'axu', air: '華航', no: 'CI222', who: '阿續・小白・Remi', from: ['TSA', '台北松山', '18:05'], to: ['HND', '羽田 第3航廈', '22:05'], tz: [8, 9], est: true },
    { date: '2027-01-22', wd: '五', fam: 'kevin', air: 'ANA', no: 'NH079', who: '凱文・Ann・Owen', from: ['HND', '羽田 第2航廈', '20:00'], to: ['CTS', '新千歲', '21:35'], tz: [9, 9] },

    { date: '2027-01-26', wd: '二', fam: 'kevin', air: 'ANA', no: 'NH4738', who: '凱文', from: ['CTS', '新千歲', '21:00'], to: ['HND', '羽田 第2航廈', '22:40'], tz: [9, 9] },
    { date: '2027-01-27', wd: '三', fam: 'kevin', air: 'ANA', no: 'NH851', who: '凱文', from: ['HND', '羽田 第2航廈', '09:20'], to: ['TSA', '台北松山', '12:30'], tz: [9, 8] },

  let flightFam = 'all';

      if (timed) {
        const mins = Math.round((arr - toMs(f.date, f.from[2], f.tz[0])) / 60000);

    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('main section').forEach(s => io.observe(s));
  }

  renderFlights();
  showDay(cur);
  renderTodos();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
